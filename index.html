<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>PINZY · Extractor Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        /* (semua style SAMA PERSIS seperti sebelumnya, cuma tambahin style buat tombol musik) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0e1a;
            color: #e8edf5;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        .splash-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #0a0e1a;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s;
        }
        .splash-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .splash-logo {
            text-align: center;
            animation: pulseIn 1.2s ease;
        }
        .splash-logo .icon {
            font-size: 48px;
            color: #4a8cff;
            margin-bottom: 12px;
        }
        .splash-logo h1 {
            font-size: 3.2rem;
            font-weight: 900;
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(135deg, #4a8cff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 4px;
        }
        .splash-logo .bar {
            width: 60px;
            height: 3px;
            margin: 12px auto 0;
            background: linear-gradient(90deg, #4a8cff, #a855f7);
            border-radius: 10px;
        }
        @keyframes pulseIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image:
                linear-gradient(rgba(40, 80, 180, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(40, 80, 180, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }
        .bg-orb {
            position: fixed;
            top: -20%;
            right: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(0, 120, 255, 0.08), transparent 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }
        .bg-orb-2 {
            position: fixed;
            bottom: -20%;
            left: -10%;
            width: 50%;
            height: 50%;
            background: radial-gradient(circle, rgba(100, 0, 255, 0.06), transparent 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }
        .video-frame {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 200px;
            margin: 0 auto 30px;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(74, 140, 255, 0.15);
            box-shadow: 0 0 40px rgba(74, 140, 255, 0.05);
            z-index: 1;
            background: #000;
        }
        .video-frame video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.6) saturate(1.1);
            display: block;
        }
        .video-frame .badge {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 1px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            z-index: 2;
        }
        .main {
            max-width: 960px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            padding: 0 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }
        header .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 6px;
        }
        header .brand svg {
            width: 28px;
            height: 28px;
        }
        header .brand .brand-text {
            font-size: 0.9rem;
            font-weight: 600;
            color: #4a8cff;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        header h1 {
            font-size: 2.8rem;
            font-weight: 900;
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(135deg, #4a8cff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        header .subtitle {
            color: rgba(255, 255, 255, 0.35);
            font-size: 0.9rem;
            letter-spacing: 2px;
            margin-top: 4px;
            font-weight: 300;
        }
        /* TOMBOL MUSIK DI HEADER */
        .music-btn {
            position: absolute;
            top: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.5);
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }
        .music-btn:hover {
            background: rgba(74, 140, 255, 0.12);
            border-color: #4a8cff;
            color: #fff;
        }
        .music-btn.active {
            background: rgba(74, 140, 255, 0.15);
            border-color: #4a8cff;
            color: #4a8cff;
        }
        .panel {
            background: rgba(12, 18, 34, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 28px 30px;
            border: 1px solid rgba(74, 140, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }
        .input-row {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }
        .input-row input {
            flex: 1;
            min-width: 200px;
            padding: 14px 20px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }
        .input-row input:focus {
            border-color: #4a8cff;
            box-shadow: 0 0 25px rgba(74, 140, 255, 0.08);
        }
        .input-row input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }
        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 60px;
            background: linear-gradient(135deg, #4a8cff, #6c3dff);
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            box-shadow: 0 6px 25px rgba(74, 140, 255, 0.15);
        }
        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 35px rgba(74, 140, 255, 0.25);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        #blockAlertZone {
            margin-top: 12px;
            font-size: 0.85rem;
            color: #f59e0b;
            min-height: 24px;
        }
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin: 20px 0 18px;
            padding: 14px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }
        .stat-item {
            text-align: center;
        }
        .stat-item .label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 1px;
            font-weight: 300;
        }
        .stat-item .value {
            font-size: 1.6rem;
            font-weight: 700;
            color: #4a8cff;
        }
        .loader {
            display: none;
            text-align: center;
            padding: 30px 0;
        }
        .loader .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(74, 140, 255, 0.1);
            border-top: 4px solid #4a8cff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .loader p {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.9rem;
        }
        .result-panel {
            display: none;
            margin-top: 20px;
        }
        .result-panel.show {
            display: block;
        }
        .result-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 14px;
        }
        .chip {
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.04);
            font-weight: 300;
        }
        .code-wrapper {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .code-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 18px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }
        .code-toolbar .info {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 300;
        }
        .code-toolbar .actions {
            display: flex;
            gap: 12px;
        }
        .code-toolbar .actions button {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
        }
        .code-toolbar .actions button:hover {
            color: #fff;
        }
        .code-wrapper pre {
            padding: 20px 24px;
            margin: 0;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            color: #c8d0e0;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 400px;
            overflow-y: auto;
        }
        .result-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .copy-btn, .preview-toggle-btn {
            padding: 10px 24px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }
        .copy-btn:hover, .preview-toggle-btn:hover {
            background: rgba(74, 140, 255, 0.1);
            border-color: #4a8cff;
        }
        .copy-btn {
            background: linear-gradient(135deg, #4a8cff, #6c3dff);
            border: none;
        }
        .copy-btn:hover {
            background: linear-gradient(135deg, #5a9cff, #7c4dff);
        }
        .preview-section {
            display: none;
            margin-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 20px;
        }
        .preview-section.show {
            display: block;
        }
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }
        .preview-header h3 {
            font-size: 1rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .preview-header h3 .count {
            font-size: 0.7rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.2);
        }
        .preview-tools {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .preview-devices {
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 40px;
            padding: 4px;
        }
        .preview-devices button {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.25);
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .preview-devices button.active {
            background: rgba(74, 140, 255, 0.15);
            color: #4a8cff;
        }
        .btn-ghost {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.3);
            padding: 6px 14px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-ghost:hover {
            border-color: rgba(74, 140, 255, 0.2);
            color: #fff;
        }
        .preview-container {
            position: relative;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            min-height: 340px;
        }
        .preview-frame-wrapper {
            display: flex;
            justify-content: center;
        }
        .device-frame {
            background: #0a0e1a;
            border-radius: 20px;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s;
            width: 100%;
            max-width: 100%;
        }
        .device-frame.desktop {
            max-width: 100%;
        }
        .device-frame.tablet {
            max-width: 80%;
        }
        .device-frame.mobile {
            max-width: 45%;
        }
        .device-frame iframe {
            width: 100%;
            height: 400px;
            border: none;
            border-radius: 12px;
            background: #fff;
        }
        .preview-empty-state {
            text-align: center;
            padding: 50px 20px;
            color: rgba(255, 255, 255, 0.15);
        }
        .preview-empty-state svg {
            margin-bottom: 16px;
            color: rgba(255, 255, 255, 0.05);
        }
        .preview-empty-state .sub {
            font-size: 0.8rem;
            margin-top: 4px;
        }
        .history-list {
            margin-top: 20px;
            max-height: 160px;
            overflow-y: auto;
        }
        .history-empty {
            text-align: center;
            color: rgba(255, 255, 255, 0.1);
            font-size: 0.85rem;
            padding: 20px;
        }
        footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.08);
            letter-spacing: 2px;
        }
        @media (max-width: 600px) {
            body { padding: 12px; }
            header h1 { font-size: 2rem; }
            .panel { padding: 20px 16px; }
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .input-row { flex-direction: column; }
            .btn { justify-content: center; }
            .video-frame { height: 140px; }
            .device-frame.mobile { max-width: 70%; }
            .device-frame.tablet { max-width: 90%; }
            .result-actions { flex-direction: column; }
            .music-btn { position: static; margin-top: 10px; display: inline-flex; }
            header { display: flex; flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>

    <!-- SPLASH -->
    <div class="splash-overlay" id="splash">
        <div class="splash-logo">
            <div class="icon">⚡</div>
            <h1>PINZY</h1>
            <div class="bar"></div>
        </div>
    </div>

    <!-- BACKGROUND -->
    <div class="bg-grid"></div>
    <div class="bg-orb"></div>
    <div class="bg-orb-2"></div>

    <!-- VIDEO -->
    <div class="video-frame">
        <video id="bgVideo" autoplay loop muted playsinline preload="auto">
            <source src="BigBuckBunny.mp4" type="video/mp4">
            <source src="BigBuckBunny.mp4" type="video/mp4">
        </video>
        <span class="badge">🔹 pinzy stream</span>
    </div>

    <!-- ===== AUDIO (BACKGROUND MUSIC) ===== -->
    <audio id="bgMusic" autoplay loop muted preload="auto">
        <source src="BigBuckBunny.mp3" type="audio/mpeg">
        <!-- fallback kalo link pertama error -->
        <source src="BigBuckBunny.mp3" type="audio/mpeg">
    </audio>

    <!-- MAIN -->
    <div class="main">

        <header>
            <div class="brand">
                <svg viewBox="0 0 28 28" fill="none" stroke="#4a8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="2" width="24" height="24" rx="6" />
                    <path d="M10 8L18 8" />
                    <path d="M10 14L18 14" />
                    <path d="M10 20L14 20" />
                    <circle cx="20" cy="20" r="3" />
                </svg>
                <span class="brand-text">pinzy protocol</span>
            </div>
            <h1>PINZY EXTRACT</h1>
            <p class="subtitle">Secure Web Intelligence • Real-time Source Extraction</p>
            <!-- TOMBOL MUSIK -->
            <button class="music-btn" id="musicToggle">🔇 Musik</button>
        </header>

        <div class="panel">

            <!-- INPUT -->
            <div class="input-row">
                <input type="url" id="targetUrl" placeholder="https://website.com/target-page" autofocus />
                <button class="btn" id="genBtn">
                    <svg width="18" height="18" viewBox="0 0 18 18
